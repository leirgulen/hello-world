<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nettbutikk - Visit Hornelen</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>

<header class="site-header">
  <div class="header-inner">
    <a href="../index.html" class="logo">Visit<span>Hornelen</span></a>
    <button class="nav-toggle" onclick="document.querySelector('.nav-links').classList.toggle('open')">&#9776;</button>
    <ul class="nav-links">
      <li><a href="../index.html">Hjem</a></li>
      <li><a href="articles.html">Artikler</a></li>
      <li><a href="gallery.html">Galleri</a></li>
      <li><a href="map.html">Kart</a></li>
      <li><a href="events.html">Arrangementer</a></li>
      <li><a href="booking.html">Booking</a></li>
      <li><a href="shop.html" class="active">Nettbutikk</a></li>
      <li><a href="../admin/index.html">Admin</a></li>
    </ul>
    <button class="btn btn-small" style="background:var(--accent); color:var(--primary); border:none;" onclick="toggleCart()">
      Handlekurv <span class="cart-badge" id="cart-count">0</span>
    </button>
  </div>
</header>

<div class="page-header">
  <h1>Nettbutikk</h1>
  <p>Suvenirer, lokale produkter og utstyr fra Hornelen-regionen</p>
</div>

<section class="section">
  <div class="container">
    <div class="gallery-filters" style="margin-bottom:30px;">
      <button class="filter-btn active" data-filter="all">Alle</button>
      <button class="filter-btn" data-filter="suvenir">Suvenirer</button>
      <button class="filter-btn" data-filter="mat">Lokalmat</button>
      <button class="filter-btn" data-filter="klaer">Klaer</button>
      <button class="filter-btn" data-filter="utstyr">Utstyr</button>
    </div>

    <div class="grid grid-4" id="products-grid"></div>
  </div>
</section>

<!-- Cart Sidebar -->
<div class="cart-overlay" id="cart-overlay" onclick="toggleCart()"></div>
<div class="cart-sidebar" id="cart-sidebar">
  <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
    <h2 style="color:var(--primary);">Handlekurv</h2>
    <button style="background:none; border:none; font-size:1.5rem; cursor:pointer;" onclick="toggleCart()">&times;</button>
  </div>
  <div id="cart-items"></div>
  <div class="cart-total">
    Total: <span id="cart-total-price">kr 0,-</span>
  </div>
  <button class="btn btn-primary" style="width:100%; margin-top:12px;" onclick="checkout()">Gaa til Kassen</button>
  <button class="btn btn-small" style="width:100%; margin-top:8px; border:2px solid var(--border);" onclick="clearCart()">Toem Handlekurv</button>
</div>

<!-- Checkout Modal -->
<div class="modal-overlay" id="checkout-modal">
  <div class="modal" id="checkout-content"></div>
</div>

<footer class="site-footer">
  <div class="container">
    <div class="footer-bottom">
      &copy; 2026 Visit Hornelen. Alle rettigheter reservert.
    </div>
  </div>
</footer>

<script src="../js/main.js"></script>
<script>
const defaultProducts = [
  { id:1, name:"Hornelen T-skjorte", price:349, category:"klaer", icon:"&#128085;", color:"#2a5298", desc:"Myk bomullsskjorte med Hornelen-motiv" },
  { id:2, name:"Fjordkaffe 250g", price:149, category:"mat", icon:"&#9749;", color:"#8B4513", desc:"Lokalbrent kaffe fra Bremanger" },
  { id:3, name:"Hornelen Noekkelhenger", price:99, category:"suvenir", icon:"&#128273;", color:"#d4a843", desc:"Haandlaget noekkelhenger i tre" },
  { id:4, name:"Turlue Hornelen", price:279, category:"klaer", icon:"&#129506;", color:"#2d8a6e", desc:"Varm ullue med brodert Hornelen-logo" },
  { id:5, name:"Roeykelaks 200g", price:189, category:"mat", icon:"&#127843;", color:"#e74c3c", desc:"Tradisjonelt roeykt laks fra Bremanger" },
  { id:6, name:"Postkort-sett (10 stk)", price:79, category:"suvenir", icon:"&#127748;", color:"#3498db", desc:"Vakre bilder fra Hornelen-regionen" },
  { id:7, name:"Turflasken Hornelen", price:299, category:"utstyr", icon:"&#129380;", color:"#1a365d", desc:"Isolert drikkeflaske 750ml med logo" },
  { id:8, name:"Tursekk 25L", price:599, category:"utstyr", icon:"&#127890;", color:"#8e44ad", desc:"Lett og vannavstotende dagsekk" },
  { id:9, name:"Honning fra Bremanger", price:129, category:"mat", icon:"&#127855;", color:"#f39c12", desc:"Ren honning fra lokale bikuber" },
  { id:10, name:"Hornelen Kopp", price:149, category:"suvenir", icon:"&#9749;", color:"#2980b9", desc:"Keramisk kopp med fjord-motiv" },
  { id:11, name:"Softshell-jakke", price:899, category:"klaer", icon:"&#129509;", color:"#34495e", desc:"Vind- og vanntett jakke med Hornelen-broderi" },
  { id:12, name:"Turboks i tre", price:199, category:"utstyr", icon:"&#127859;", color:"#27ae60", desc:"Haandlaget matboks i bjork" }
];

let cart = JSON.parse(localStorage.getItem('vh_cart') || '[]');

function renderProducts(filter) {
  const stored = JSON.parse(localStorage.getItem('vh_products') || 'null');
  const products = stored || defaultProducts;
  const filtered = filter === 'all' ? products : products.filter(p => p.category === filter);
  document.getElementById('products-grid').innerHTML = filtered.map(p => `
    <div class="card product-card">
      <div class="card-img" style="background:linear-gradient(135deg, ${p.color}, ${p.color}cc); height:180px;">
        <div style="display:flex; align-items:center; justify-content:center; height:100%; font-size:3.5rem;">${p.icon}</div>
      </div>
      <div class="card-body" style="text-align:center;">
        <h3 style="font-size:1rem;">${p.name}</h3>
        <p style="font-size:0.85rem;">${p.desc}</p>
        <div class="product-price">kr ${p.price.toLocaleString('no-NO')},-</div>
        <button class="btn btn-primary btn-small" onclick="addToCart(${p.id})">Legg i Kurv</button>
      </div>
    </div>
  `).join('');
}

function addToCart(id) {
  const stored = JSON.parse(localStorage.getItem('vh_products') || 'null');
  const products = stored || defaultProducts;
  const product = products.find(p => p.id === id);
  if (!product) return;
  const existing = cart.find(c => c.id === id);
  if (existing) { existing.qty++; }
  else { cart.push({ ...product, qty: 1 }); }
  saveCart();
  renderCart();
}

function removeFromCart(id) {
  cart = cart.filter(c => c.id !== id);
  saveCart();
  renderCart();
}

function updateQty(id, delta) {
  const item = cart.find(c => c.id === id);
  if (!item) return;
  item.qty += delta;
  if (item.qty <= 0) { cart = cart.filter(c => c.id !== id); }
  saveCart();
  renderCart();
}

function saveCart() {
  localStorage.setItem('vh_cart', JSON.stringify(cart));
}

function renderCart() {
  const count = cart.reduce((s, c) => s + c.qty, 0);
  document.getElementById('cart-count').textContent = count;
  const total = cart.reduce((s, c) => s + c.price * c.qty, 0);
  document.getElementById('cart-total-price').textContent = `kr ${total.toLocaleString('no-NO')},-`;
  document.getElementById('cart-items').innerHTML = cart.length === 0
    ? '<p style="color:var(--text-muted); text-align:center; padding:20px;">Handlekurven er tom</p>'
    : cart.map(c => `
      <div class="cart-item">
        <div style="font-size:1.5rem;">${c.icon}</div>
        <div class="cart-item-info">
          <strong style="font-size:0.9rem;">${c.name}</strong><br>
          <small>kr ${c.price.toLocaleString('no-NO')},- x ${c.qty}</small>
        </div>
        <div style="display:flex; align-items:center; gap:6px;">
          <button class="btn btn-small" style="padding:4px 8px; border:1px solid var(--border);" onclick="updateQty(${c.id},-1)">-</button>
          <span>${c.qty}</span>
          <button class="btn btn-small" style="padding:4px 8px; border:1px solid var(--border);" onclick="updateQty(${c.id},1)">+</button>
          <button class="cart-item-remove" onclick="removeFromCart(${c.id})">&times;</button>
        </div>
      </div>
    `).join('');
}

function toggleCart() {
  document.getElementById('cart-sidebar').classList.toggle('open');
  document.getElementById('cart-overlay').classList.toggle('open');
}

function clearCart() {
  cart = [];
  saveCart();
  renderCart();
}

function checkout() {
  if (cart.length === 0) { alert('Handlekurven er tom!'); return; }
  const total = cart.reduce((s, c) => s + c.price * c.qty, 0);
  const items = cart.map(c => `${c.name} x${c.qty}: kr ${(c.price * c.qty).toLocaleString('no-NO')},-`).join('<br>');

  // Save order
  const orders = JSON.parse(localStorage.getItem('vh_orders') || '[]');
  orders.push({ id: Date.now(), items: [...cart], total, date: new Date().toISOString(), status: 'pending' });
  localStorage.setItem('vh_orders', JSON.stringify(orders));

  document.getElementById('checkout-content').innerHTML = `
    <h2 style="color:var(--secondary);">Bestilling Fullfoert!</h2>
    <p style="margin:16px 0;">Takk for din bestilling!</p>
    <div style="background:var(--bg-light); padding:16px; border-radius:var(--radius); margin:16px 0; font-size:0.9rem;">
      ${items}
      <hr style="margin:12px 0; border:none; border-top:1px solid var(--border);">
      <strong>Total: kr ${total.toLocaleString('no-NO')},-</strong>
    </div>
    <p style="color:var(--text-muted); font-size:0.9rem;">Ordrebekreftelse vises her. I en fullverdig versjon vil betaling og frakt haandteres.</p>
    <div class="modal-actions">
      <button class="btn btn-primary btn-small" onclick="document.getElementById('checkout-modal').classList.remove('active'); clearCart(); toggleCart();">Lukk</button>
    </div>
  `;
  document.getElementById('checkout-modal').classList.add('active');
}

document.getElementById('checkout-modal').addEventListener('click', function(e) {
  if (e.target === this) this.classList.remove('active');
});

document.querySelectorAll('.filter-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    renderProducts(btn.dataset.filter);
  });
});

renderProducts('all');
renderCart();
</script>
</body>
</html>
